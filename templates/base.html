<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}CampusConnect{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { color: #111; background: #fff; }
            a { color: #111; }
            a:hover { color: #555; }
            .btn-primary {
                --bs-btn-color: #fff;
                --bs-btn-bg: #111;
                --bs-btn-border-color: #111;
                --bs-btn-hover-color: #fff;
                --bs-btn-hover-bg: #333;
                --bs-btn-hover-border-color: #333;
                --bs-btn-active-bg: #000;
                --bs-btn-active-border-color: #000;
            }
            .alert-success {
                color: #111;
                background-color: #f5f5f5;
                border-color: #ddd;
            }
            form p { margin-bottom: 1rem; }
            form label { display: block; margin-bottom: .35rem; }
            form input:not([type=checkbox]), form select, form textarea {
                display: block;
                width: 100%;
                padding: .375rem .75rem;
                border: 1px solid #dee2e6;
                border-radius: .375rem;
                background-color: #fff;
            }
            form ul.errorlist { color: #b02a37; padding-left: 1.25rem; }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand navbar-dark bg-black">
            <div class="container">
                <a class="navbar-brand" href="{% url 'dashboard' %}">CampusConnect</a>
                <div class="navbar-nav ms-auto align-items-center gap-3">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'profile' %}">Profile</a>
                        <span class="navbar-text text-white">Hi, {{ user.username }}!</span>
                        <form method="post" action="{% url 'logout' %}" class="m-0">
                            {% csrf_token %}
                            <button class="btn btn-outline-light btn-sm" type="submit">Log Out</button>
                        </form>
                    {% else %}
                        <a class="nav-link" href="{% url 'login' %}">Log In</a>
                        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <main class="container py-4">
            {% for message in messages %}
                <div class="alert alert-success" role="alert">{{ message }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
