{% extends "base.html" %}
{% block title %}My Profile | CampusConnect{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit your profile</h1>
<form method="post" class="col-md-7 col-lg-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save changes</button>
</form>
{% endblock %}
